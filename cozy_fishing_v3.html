<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎣 Cozy Fisher</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0d2233;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}

.game{
  width:420px;height:780px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#0d2a3d 0%,#1a4a6a 40%,#0d3347 100%);
  border-radius:20px;box-shadow:0 0 60px rgba(0,0,0,0.8);
  border:2px solid rgba(100,180,255,0.15);
}

/* SKY */
.sky{position:absolute;top:0;left:0;right:0;height:38%;background:linear-gradient(180deg,#061520 0%,#0d2a3d 50%,#1a4f72 100%)}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 2s infinite alternate}
@keyframes twinkle{0%{opacity:.2}100%{opacity:1}}
.moon{position:absolute;top:14px;right:60px;width:38px;height:38px;background:#fffde0;border-radius:50%;box-shadow:0 0 18px 6px rgba(255,253,200,.25)}

/* WATER */
.water{position:absolute;top:37%;left:0;right:0;bottom:0;background:linear-gradient(180deg,#1a6e9a 0%,#0d4a6e 60%,#083550 100%)}
.wave{position:absolute;top:0;left:-100%;width:300%;height:28px;background:repeating-linear-gradient(90deg,transparent 0%,rgba(255,255,255,.06) 25%,transparent 50%);animation:wave 5s linear infinite}
.wave2{animation-delay:-2.5s;opacity:.5;top:8px}
@keyframes wave{0%{transform:translateX(0)}100%{transform:translateX(33.33%)}}

/* SHORE */
.shore{position:absolute;top:35.5%;left:0;right:0;height:4%;background:linear-gradient(180deg,#2d7a4a 0%,#1e5e35 100%)}
.shore::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,#3a9960 0,#3a9960 18px,#2a7a48 18px,#2a7a48 36px)}

/* DOCK */
.dock{position:absolute;top:38.5%;left:50%;transform:translateX(-50%);width:88px;z-index:4}
.dock-plank{width:88px;height:13px;background:#7a5812;border-radius:3px;border:2px solid #5a3e0a}
.dock-post{width:9px;height:30px;background:#5a3e0a;border-radius:2px;position:absolute;bottom:-28px}
.dock-post.l{left:9px}.dock-post.r{right:9px}

/* CHARACTER */
.char{position:absolute;top:31%;left:50%;transform:translateX(-155%);width:48px;z-index:6}
.char-hat{width:26px;height:14px;background:#7a3a0a;border-radius:12px 12px 0 0;margin:0 auto;border:2px solid #4a2005}
.char-hat::after{content:'';display:block;height:4px;background:#4a2005;border-radius:1px;margin:0 -4px}
.char-head{width:22px;height:20px;background:#c8936a;border-radius:50%;margin:-4px auto 0;border:2px solid #9a6840;position:relative}
.char-head::after{content:'🎣';font-size:13px;position:absolute;right:-18px;top:-5px}
.char-body{width:30px;height:26px;background:#3a2818;border-radius:50% 50% 40% 40%;margin:0 auto;border:2px solid #2a1a0a}

/* FISHING LINE */
.line-wrap{position:absolute;top:40%;left:calc(50% - 78px);z-index:5;transform-origin:top center;animation:linesway 3.5s ease-in-out infinite}
@keyframes linesway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(2deg)}}
.line{width:1.5px;height:90px;background:rgba(255,255,255,.35);margin:0 auto}
.bobber{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7070,#c0392b);border:2px solid #8e1c1c;margin:-1px auto 0;animation:bob 2.2s ease-in-out infinite;position:relative}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.bobber::after{content:'';position:absolute;width:5px;height:5px;background:rgba(255,255,255,.6);border-radius:50%;top:2px;left:2px}
.bobber.nibble{animation:nibble .22s ease-in-out infinite;background:radial-gradient(circle at 35% 35%,#ffdd44,#f5a500);border-color:#8a6000}
@keyframes nibble{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}

/* HUD TOP */
.hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:20}
.avatar{width:42px;height:42px;border-radius:50%;background:#3a2818;border:2.5px solid #e8a020;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pname{font-family:'Fredoka One',cursive;color:#fff;font-size:15px;line-height:1.1}
.plevel{font-size:11px;color:#f5c842;font-weight:700}
.currencies{display:flex;gap:6px}
.cpill{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 9px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#fff;white-space:nowrap}

/* SIDE BUTTONS */
.side{position:absolute;top:62px;display:flex;flex-direction:column;gap:6px;padding:6px 4px;z-index:20}
.side.left{left:0}.side.right{right:0}
.sbtn{width:54px;background:rgba(8,28,48,.85);border:1.5px solid rgba(80,170,255,.22);border-radius:11px;display:flex;flex-direction:column;align-items:center;padding:6px 3px;cursor:pointer;gap:2px;position:relative;transition:transform .12s,background .12s}
.sbtn:hover{background:rgba(20,60,100,.85);transform:scale(1.05)}
.sbtn:active{transform:scale(.93)}
.sbtn .si{font-size:21px;line-height:1}
.sbtn .sl{font-size:8.5px;font-weight:800;color:rgba(255,255,255,.72);text-align:center;line-height:1.15}
.sbtn .sn{position:absolute;top:-5px;right:-5px;width:15px;height:15px;background:#e74c3c;border-radius:50%;border:1.5px solid rgba(8,28,48,.9);display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:800}

/* ── TANK (fixed height, swipeable) ── */
.tank-shell{
  position:absolute;
  bottom:28%;left:8px;right:8px;
  height:130px;
  background:rgba(0,40,70,.65);
  border:2px solid rgba(80,170,255,.2);
  border-radius:14px;
  z-index:8;
  display:flex;
  flex-direction:column;
}

/* header row: page dots + count + arrows */
.tank-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 10px 0;flex-shrink:0;
}
.tank-count{font-size:10px;font-weight:900;color:rgba(255,255,255,.7);letter-spacing:.5px}
.tank-count span{color:#7dd3f0}
.tank-dots{display:flex;gap:4px;align-items:center}
.tank-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .2s}
.tank-dot.active{background:#7dd3f0}
.tank-arrows{display:flex;gap:4px}
.tank-arr{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.tank-arr:hover{background:rgba(80,170,255,.2);color:#fff}
.tank-arr:disabled{opacity:.25;cursor:default}

/* the sliding viewport */
.tank-viewport{
  flex:1;overflow:hidden;position:relative;padding:6px 7px 6px;
}
.tank-track{
  display:flex;gap:5px;
  height:100%;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}

/* each "page" is exactly viewport-width wide */
.tank-page{
  display:flex;gap:5px;
  flex-shrink:0;
  height:100%;
}

.slot{
  flex:1;
  background:rgba(0,20,40,.55);
  border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1.5px dashed rgba(80,170,255,.2);
  cursor:pointer;
  transition:all .15s;
  position:relative;overflow:hidden;
  min-width:0;
}
.slot:hover{background:rgba(0,40,80,.6);transform:scale(1.03)}
.slot:active{transform:scale(.95)}
.slot.caught{border-style:solid;border-color:rgba(80,200,255,.35)}
.slot .fe{font-size:22px;animation:fishbob 2.2s ease-in-out infinite}
@keyframes fishbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.slot .fn{font-size:8px;color:rgba(255,255,255,.72);margin-top:2px;font-weight:800;text-align:center;line-height:1.1}
.slot .fs{font-size:7px;color:#f5c842;margin-top:1px}
.slot .fv{position:absolute;top:3px;right:3px;font-size:7px;background:#c0620a;color:#fff;border-radius:4px;padding:1px 4px;font-weight:800}
.slot.empty .fe{opacity:.18;font-size:16px}

/* FULL TANK warning banner */
.tank-full-banner{
  display:none;position:absolute;inset:0;border-radius:14px;z-index:12;
  background:rgba(220,60,40,.18);border:2px solid rgba(255,100,80,.4);
  align-items:center;justify-content:center;pointer-events:none;
}
.tank-full-banner.show{display:flex}
.tank-full-banner span{font-family:'Fredoka One',cursive;font-size:15px;color:#ff8070;letter-spacing:.5px;text-shadow:0 0 12px rgba(255,80,60,.6)}

/* CAST AREA */
.cast-area{position:absolute;bottom:9.5%;left:50%;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;gap:6px}
.castbtn{
  background:linear-gradient(180deg,#f0a820 0%,#d4870a 100%);
  border:3px solid #8a5200;border-radius:18px;
  padding:11px 44px;
  font-family:'Fredoka One',cursive;font-size:24px;color:#fff;
  text-shadow:0 2px 5px rgba(0,0,0,.5);
  transition:all .12s;letter-spacing:.5px;
  box-shadow:0 5px 0 #6a3e00;outline:none;
  white-space:nowrap;
}
.castbtn:hover{filter:brightness(1.1)}
.castbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #6a3e00}
.castbtn.busy{background:linear-gradient(180deg,#4a7e98 0%,#2a5e78 100%);border-color:#1a3e58;box-shadow:0 5px 0 #0a1e28}
.castbtn.full{background:linear-gradient(180deg,#883030 0%,#5a1a1a 100%);border-color:#3a0a0a;box-shadow:0 5px 0 #1a0505}

/* energy: just a clean text line + regen bar */
.energy-strip{display:flex;flex-direction:column;align-items:center;gap:3px;width:240px}
.energy-text{font-size:11px;font-weight:800;color:rgba(255,255,255,.6);letter-spacing:.3px}
.energy-text em{color:#f5d020;font-style:normal}
.regen-bar-wrap{width:180px;height:4px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.regen-bar{height:100%;background:linear-gradient(90deg,#f5d020,#7dd3f0);border-radius:999px;width:0%;transition:width .1s linear}
.regen-countdown{font-size:9px;font-weight:800;color:rgba(255,255,255,.35);letter-spacing:.2px}

.cast-sub{font-size:11px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.3px;text-align:center}
.cast-sub span{color:#7dd3f0;cursor:pointer;text-decoration:underline}

/* COUNTERS */
.fish-count-box{position:absolute;top:43%;left:10px;background:rgba(0,0,0,.45);border:1px solid rgba(80,170,255,.2);border-radius:9px;padding:4px 9px;z-index:10;min-width:90px}
.fcl{font-size:9px;color:rgba(255,255,255,.45);font-weight:800}
.fcv{font-size:16px;font-weight:900;color:#7dd3f0;line-height:1}
.fcs{font-size:8px;color:#f5c842;font-weight:800;margin-top:3px}

/* BOTTOM NAV */
.botnav{position:absolute;bottom:0;left:0;right:0;background:rgba(5,18,30,.96);border-top:2px solid rgba(80,170,255,.18);padding:7px 4px 10px;display:flex;z-index:20}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:9px;padding:4px 0;transition:all .12s;border:none;background:transparent;position:relative;color:inherit}
.nbtn:hover{background:rgba(80,170,255,.1)}
.nbtn:active{transform:scale(.92)}
.nbtn.active{background:rgba(80,200,255,.12)}
.nbtn .ni{font-size:22px}
.nbtn .nl{font-size:9px;font-weight:800;color:rgba(255,255,255,.55)}
.nbtn.active .nl{color:#7dd3f0}
.nbtn .nn{position:absolute;top:1px;right:8px;width:15px;height:15px;background:#e74c3c;border-radius:50%;border:1.5px solid rgba(5,18,30,.9);display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:800}

/* FX */
.fishpop{position:absolute;pointer-events:none;z-index:35;animation:fpop 1.3s forwards}
@keyframes fpop{0%{opacity:1;transform:translateY(0) scale(1) rotate(-10deg)}70%{opacity:1;transform:translateY(-60px) scale(1.5) rotate(10deg)}100%{opacity:0;transform:translateY(-85px) scale(.8)}}
.toast{position:absolute;top:68px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid rgba(100,255,160,.3);border-radius:12px;padding:8px 16px;font-size:12px;font-weight:800;color:#7dffc0;z-index:50;animation:tpop 2.2s forwards;white-space:nowrap;pointer-events:none}
@keyframes tpop{0%{opacity:0;transform:translateX(-50%) translateY(-8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-12px)}}
.bubble{position:absolute;border-radius:50%;background:rgba(120,210,255,.1);border:1px solid rgba(120,210,255,.18);animation:brise linear forwards}
@keyframes brise{0%{transform:translateY(0);opacity:.7}100%{transform:translateY(-100px);opacity:0}}
.catch-flash{position:absolute;inset:0;background:rgba(255,255,200,.12);z-index:40;animation:flash .4s forwards;pointer-events:none}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

/* OVERLAYS */
.overlay{position:absolute;inset:0;background:rgba(3,12,20,.78);backdrop-filter:blur(4px);z-index:60;display:none}
.overlay.open{display:block}
.panel{position:absolute;left:10px;right:10px;bottom:84px;top:108px;background:linear-gradient(180deg,rgba(12,35,55,.97),rgba(5,20,35,.97));border:1.5px solid rgba(80,170,255,.22);border-radius:18px;box-shadow:0 20px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
.panel-title{font-family:'Fredoka One',cursive;color:#fff;font-size:18px;letter-spacing:.3px}
.panel-close{width:34px;height:34px;border:none;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:18px}
.panel-body{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px}
.card h4{font-size:13px;color:#fff;margin-bottom:4px}
.card p{font-size:11px;color:rgba(255,255,255,.7);line-height:1.35}
.shop-row,.upgrade-row,.bestiary-row,.stat-row,.loc-row{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px}
.shop-row button,.upgrade-row button,.loc-row button{margin-left:auto;border:none;background:linear-gradient(180deg,#f0a820 0%,#d4870a 100%);color:#fff;font-weight:900;border-radius:12px;padding:9px 12px;box-shadow:0 4px 0 #6a3e00;cursor:pointer}
.shop-row button:active,.upgrade-row button:active,.loc-row button:active{transform:translateY(3px);box-shadow:0 1px 0 #6a3e00}
.shop-row button[disabled],.upgrade-row button[disabled],.loc-row button[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.row-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.row-title{font-size:13px;color:#fff;font-weight:800}
.row-sub{font-size:10px;color:rgba(255,255,255,.65)}
.row-icon{font-size:24px;width:28px;text-align:center}
.badge{font-size:9px;font-weight:900;color:#08131f;background:#7dd3f0;border-radius:999px;padding:2px 7px;align-self:flex-start}
.progress{height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:5px}
.progress>div{height:100%;background:linear-gradient(90deg,#7dd3f0,#f5c842);border-radius:999px}
.empty-state{font-size:12px;color:rgba(255,255,255,.7);text-align:center;padding:24px 8px}
</style>
</head>
<body>
<div class="game" id="game">

  <div class="sky" id="sky"><div class="moon"></div></div>
  <div class="water"><div class="wave"></div><div class="wave wave2"></div></div>
  <div class="shore"></div>

  <div class="dock">
    <div class="dock-plank">
      <div class="dock-post l"></div><div class="dock-post r"></div>
    </div>
  </div>

  <div class="char">
    <div class="char-hat"></div>
    <div class="char-head"></div>
    <div class="char-body"></div>
  </div>

  <div class="line-wrap">
    <div class="line"></div>
    <div class="bobber" id="bobber"></div>
  </div>

  <div class="hud">
    <div class="avatar">🐟</div>
    <div class="pinfo">
      <div class="pname">Capy Fisher</div>
      <div class="plevel" id="level-line">🎣 Level 1 · Lake Shore</div>
    </div>
    <div class="currencies">
      <div class="cpill">🪙 <span id="gold-disp">26</span></div>
      <div class="cpill">💎 <span id="gem-disp">0</span></div>
    </div>
  </div>

  <div class="side left">
    <div class="sbtn" data-panel="home-panel"><div class="si">🏡</div><div class="sl">Home</div></div>
    <div class="sbtn" onclick="claimDaily()"><div class="si">🎁</div><div class="sl">Gifts</div><div class="sn">!</div></div>
    <div class="sbtn" data-panel="shop-panel"><div class="si">🛒</div><div class="sl">Shop</div></div>
    <div class="sbtn" onclick="showStreak()"><div class="si">📅</div><div class="sl">7 Days</div></div>
  </div>

  <div class="side right">
    <div class="sbtn" data-panel="map-panel"><div class="si">🗺️</div><div class="sl">Map</div><div class="sn">!</div></div>
    <div class="sbtn" data-panel="book-panel"><div class="si">📖</div><div class="sl">Book</div></div>
    <div class="sbtn" data-panel="craft-panel"><div class="si">⚙️</div><div class="sl">Craft</div><div class="sn" id="craft-badge">!</div></div>
    <div class="sbtn" onclick="toggleNightBonus()"><div class="si">🌙</div><div class="sl">Night</div></div>
  </div>

  <div class="fish-count-box">
    <div class="fcl">TODAY</div>
    <div class="fcv" id="fc">0</div>
    <div class="fcs" id="fps-readout">0.03/sec</div>
  </div>

  <!-- TANK -->
  <div class="tank-shell" id="tank-shell">
    <div class="tank-header">
      <div class="tank-count">🧺 <span id="tank-filled">0</span>/<span id="tank-cap">5</span></div>
      <div class="tank-dots" id="tank-dots"></div>
      <div class="tank-arrows">
        <button class="tank-arr" id="arr-left" onclick="tankPage(-1)">◀</button>
        <button class="tank-arr" id="arr-right" onclick="tankPage(1)">▶</button>
      </div>
    </div>
    <div class="tank-viewport" id="tank-viewport">
      <div class="tank-track" id="tank-track"></div>
    </div>
    <div class="tank-full-banner" id="full-banner"><span>🚫 Tank Full — Sell to Keep Fishing</span></div>
  </div>

  <!-- CAST -->
  <div class="cast-area">
    <button class="castbtn" id="castbtn" onclick="cast()">Cast!  ⚡ 25</button>
    <div class="energy-strip">
      <div class="regen-bar-wrap" id="regen-wrap" style="display:none">
        <div class="regen-bar" id="regen-bar"></div>
      </div>
      <div class="regen-countdown" id="regen-countdown"></div>
    </div>
    <div class="cast-sub">tap fish to sell · <span id="aname" onclick="cycleArea()">Lake Shore</span> · <span id="quality-line" style="text-decoration:none;cursor:default;color:#f5c842">quality 5</span></div>
  </div>

  <div class="botnav">
    <button class="nbtn active" onclick="closeOverlay()"><div class="ni">🎣</div><div class="nl">Fish</div></button>
    <button class="nbtn" onclick="sellAll()"><div class="ni">🏪</div><div class="nl">Sell All</div></button>
    <button class="nbtn" data-panel="map-panel"><div class="ni">⚔️</div><div class="nl">Adventure</div></button>
    <button class="nbtn" data-panel="craft-panel"><div class="ni">⬆️</div><div class="nl">Upgrade</div><div class="nn" id="upgrade-badge">!</div></button>
    <button class="nbtn" data-panel="rank-panel"><div class="ni">🏅</div><div class="nl">Rank</div></button>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title" id="panel-title">Panel</div>
        <button class="panel-close" onclick="closeOverlay()">✕</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </div>
</div>

<script>
// ── FISH ──────────────────────────────────────────────────────────────────────
const FISH=[
  {e:'🐟',n:'Minnow',         rarity:'Common',   tier:1,v:5},
  {e:'🐠',n:'Bluegill',       rarity:'Common',   tier:1,v:9},
  {e:'🐡',n:'Pufferfish',     rarity:'Common',   tier:1,v:11},

  {name:'Lake Shore',   price:0,    qualBonus:0,  speedBonus:0,     flavor:'Starter water. Honest fish.'},
  {name:'Willow Pond',  price:140,  qualBonus:8,  speedBonus:0.01,  flavor:'Still water, better quality.'},

  {name:'Crystal Deep', price:1600, qualBonus:40, speedBonus:0.04,  flavor:'Where the smug fish live.'},
];

const UPGRADES=[
  {id:'line',   label:'Fishing Line',icon:'〰️',desc:'Raises catch speed and quality.',  base:16, scale:1.24,cap:20},
  {id:'lure',   label:'Lure',        icon:'✨',desc:'Attracts rarer fish.',              base:22, scale:1.26,cap:20},
  {id:'bait',   label:'Bait',        icon:'🪱',desc:'Improves bite rate.',               base:12, scale:1.22,cap:20},
  {id:'winder', label:'Reel',        icon:'⚙️',desc:'More fish per second.',             base:38, scale:1.28,cap:20},
  {id:'tank',   label:'Tank Upgrade',icon:'🧺',desc:'+5 tank slots per level.',          base:80, scale:1.35,cap:7},
];

// ── STATE ─────────────────────────────────────────────────────────────────────
const SLOTS_PER_PAGE = 5;
const BASE_TANK      = 5;

let gold=26, gems=0, energy=25, maxE=25;
let caughtToday=0, busy=false, areaIdx=0, xp=0, level=1;
let upgrades={line:0,lure:0,bait:0,winder:0,tank:0};
let slots=[];          // sparse array, index = slot position
let discovered=new Set();
let dailyReady=true, nightBonus=false;
let ownedAreas=new Set([0]);
let idleCarry=0;
let tankPage_=0;       // current page index

// energy regen
const REGEN_SEC=30;
let regenTimer=0;

// ── COMPUTED ──────────────────────────────────────────────────────────────────
function tankCap(){ return BASE_TANK + upgrades.tank * 5; }
function filledCount(){ return slots.filter(Boolean).length; }
function isTankFull(){ return filledCount() >= tankCap(); }
function totalPages(){ return Math.ceil(tankCap() / SLOTS_PER_PAGE); }

function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function levelThreshold(lv){return Math.round(24+lv*lv*9)}
function upgradeCost(id){
  const u=UPGRADES.find(x=>x.id===id);
  return Math.round(u.base*Math.pow(u.scale,upgrades[id]));
}
function totalUpgradeLevels(){return Object.values(upgrades).reduce((a,b)=>a+b,0)}

function getStats(){
  const area=AREAS[areaIdx];
  const fishPerSec=0.033+upgrades.bait*0.011+upgrades.line*0.007+upgrades.winder*0.018+upgrades.lure*0.005+level*0.004+area.speedBonus;
  const quality=clamp(5+upgrades.line*1.6+upgrades.lure*2.1+upgrades.bait*0.8+upgrades.winder*1.1+area.qualBonus+level*1.8+(nightBonus?8:0),0,100);
  const valueMult=1+upgrades.lure*0.06+(areaIdx*0.12)+(nightBonus?0.12:0);
  return {fishPerSec,quality,valueMult};
}

function rarityTable(q){
  const common=Math.max(18,72-q*1.15);
  const uncommon=Math.min(40,16+q*0.5);
  const rare=Math.max(4,Math.min(26,q*0.36+(nightBonus?3:0)));
  const epic=Math.max(0,Math.min(16,(q-18)*0.22+(nightBonus?2:0)));
  const legendary=Math.max(0,Math.min(8,(q-38)*0.14+(nightBonus?1:0)));
  const tot=common+uncommon+rare+epic+legendary;
  return [{rarity:'Common',w:common/tot},{rarity:'Uncommon',w:uncommon/tot},{rarity:'Rare',w:rare/tot},{rarity:'Epic',w:epic/tot},{rarity:'Legendary',w:legendary/tot}];
}
function pickRarity(q){
  const t=rarityTable(q);let sum=0,roll=Math.random();
  for(const e of t){sum+=e.w;if(roll<=sum)return e.rarity;}
  return 'Common';
}
function pickFish(q){
  const rarity=pickRarity(q);
  const pool=FISH.filter(f=>f.rarity===rarity);
  return pool[Math.floor(Math.random()*pool.length)]||FISH[0];
}
function qualLabel(q){
  if(q<15)return 'Rough';if(q<30)return 'Decent';if(q<50)return 'Refined';if(q<70)return 'Premium';return 'Trophy';
}
function gainXp(n){
  xp+=n;let need=levelThreshold(level),dinged=false;
  while(xp>=need){xp-=need;level++;dinged=true;need=levelThreshold(level);}
  if(dinged) toast('⬆️ Level up! Now level '+level+'.');
}
function formatNum(n){
  if(n>=1e6)return (n/1e6).toFixed(1)+'M';
  if(n>=1e4)return (n/1e3).toFixed(1)+'K';
  return Math.round(n).toLocaleString();
}
function canUpgradeAny(){return UPGRADES.some(u=>upgrades[u.id]<u.cap&&gold>=upgradeCost(u.id));}

// ── TANK RENDERING ────────────────────────────────────────────────────────────
function buildTank(){
  const cap=tankCap();
  const pages=totalPages();
  const track=document.getElementById('tank-track');
  const viewport=document.getElementById('tank-viewport');
  const vw=viewport.clientWidth||396;

  track.innerHTML='';
  track.style.width=(vw*pages)+'px';

  for(let p=0;p<pages;p++){
    const pg=document.createElement('div');
    pg.className='tank-page';
    pg.style.width=vw+'px';
    const start=p*SLOTS_PER_PAGE;
    const end=Math.min(start+SLOTS_PER_PAGE,cap);
    for(let i=start;i<end;i++){
      const el=document.createElement('div');
      el.id='s'+i;
      const f=slots[i];
      el.className='slot'+(f?' caught':' empty');
      if(f){
        el.innerHTML=`<div class="fv">+${f.v}🪙</div><div class="fe">${f.e}</div><div class="fn">${f.n}</div><div class="fs">${f.rarity}</div>`;
      } else {
        el.innerHTML='<div class="fe">🐠</div><div class="fn">Empty</div>';
      }
      el.onclick=()=>sell(i);
      pg.appendChild(el);
    }
    track.appendChild(pg);
  }

  // dots
  const dotsEl=document.getElementById('tank-dots');
  dotsEl.innerHTML='';
  for(let p=0;p<pages;p++){
    const d=document.createElement('div');
    d.className='tank-dot'+(p===tankPage_?' active':'');
    d.onclick=()=>goToPage(p);
    d.style.cursor='pointer';
    dotsEl.appendChild(d);
  }

  applyPageTransform();
  updateTankHeader();
}

function applyPageTransform(){
  const viewport=document.getElementById('tank-viewport');
  const vw=viewport.clientWidth||396;
  document.getElementById('tank-track').style.transform=`translateX(-${tankPage_*vw}px)`;
  // update dots
  document.querySelectorAll('.tank-dot').forEach((d,i)=>d.classList.toggle('active',i===tankPage_));
  // update arrows
  document.getElementById('arr-left').disabled=tankPage_===0;
  document.getElementById('arr-right').disabled=tankPage_>=totalPages()-1;
}

function updateTankHeader(){
  document.getElementById('tank-filled').textContent=filledCount();
  document.getElementById('tank-cap').textContent=tankCap();
  const full=isTankFull();
  document.getElementById('full-banner').classList.toggle('show',full);
}

function tankPage(dir){
  tankPage_=clamp(tankPage_+dir,0,totalPages()-1);
  applyPageTransform();
}
function goToPage(p){
  tankPage_=clamp(p,0,totalPages()-1);
  applyPageTransform();
}

// swipe support
let swipeStartX=null;
document.getElementById('tank-viewport').addEventListener('touchstart',e=>{swipeStartX=e.touches[0].clientX;},{passive:true});
document.getElementById('tank-viewport').addEventListener('touchend',e=>{
  if(swipeStartX===null)return;
  const dx=e.changedTouches[0].clientX-swipeStartX;
  if(Math.abs(dx)>30) tankPage(dx<0?1:-1);
  swipeStartX=null;
});
// mouse drag
let mouseStartX=null;
document.getElementById('tank-viewport').addEventListener('mousedown',e=>{mouseStartX=e.clientX;});
document.getElementById('tank-viewport').addEventListener('mouseup',e=>{
  if(mouseStartX===null)return;
  const dx=e.clientX-mouseStartX;
  if(Math.abs(dx)>30) tankPage(dx<0?1:-1);
  mouseStartX=null;
});

function refreshSlot(i){
  const el=document.getElementById('s'+i);
  if(!el)return;
  const f=slots[i];
  if(f){
    el.className='slot caught';
    el.innerHTML=`<div class="fv">+${f.v}🪙</div><div class="fe">${f.e}</div><div class="fn">${f.n}</div><div class="fs">${f.rarity}</div>`;
  } else {
    el.className='slot empty';
    el.innerHTML='<div class="fe">🐠</div><div class="fn">Empty</div>';
  }
  updateTankHeader();
}

// ── ENERGY ────────────────────────────────────────────────────────────────────
function updateEnergyUI(){
  const full=energy>=maxE;
  const wrap=document.getElementById('regen-wrap');
  const bar=document.getElementById('regen-bar');
  const countdown=document.getElementById('regen-countdown');
  if(wrap) wrap.style.display=full?'none':'block';
  if(!full){
    if(bar) bar.style.width=((regenTimer/REGEN_SEC)*100)+'%';
    if(countdown) countdown.textContent='Next ⚡ in '+Math.ceil(REGEN_SEC-regenTimer)+'s';
  } else {
    if(countdown) countdown.textContent='';
  }
}

function regenTick(dt){
  if(energy>=maxE){regenTimer=0;return;}
  regenTimer+=dt;
  if(regenTimer>=REGEN_SEC){
    regenTimer-=REGEN_SEC;
    energy=Math.min(energy+1,maxE);
    if(energy<maxE) toast('⚡ +1 energy ('+energy+'/'+maxE+')');
    else toast('⚡ Energy fully restored!');
  }
  updateEnergyUI();
}

// ── CAST & CATCH ──────────────────────────────────────────────────────────────
function emptySlotIdx(){
  const cap=tankCap();
  for(let i=0;i<cap;i++) if(!slots[i]) return i;
  return -1;
}

function applyCatch(f,source='manual'){
  if(isTankFull()){
    if(source==='manual') toast('🚫 Tank full! Sell some fish first.');
    return false;
  }
  const stats=getStats();
  const idx=emptySlotIdx();
  if(idx===-1) return false;
  const value=Math.round(f.v*stats.valueMult);
  slots[idx]={...f,v:value};
  discovered.add(f.n);
  caughtToday++;
  gainXp(f.tier>=4?3:f.tier>=2?2:1);
  document.getElementById('fc').textContent=caughtToday;
  refreshSlot(idx);
  spawnPop(f.e);
  flashScreen();
  spawnBubbles();
  if(source==='manual') toast('🎉 Caught a '+f.n+'! ('+f.rarity+')');
  syncHud();
  return true;
}

function cast(){
  if(busy){toast('🎣 Already fishing...');return;}
  if(energy<=0){toast('⚡ No energy! Regenerating...');return;}
  if(isTankFull()){toast('🚫 Tank full! Sell fish to cast again.');return;}

  busy=true;
  energy--;
  updateEnergyUI();

  const btn=document.getElementById('castbtn');
  btn.className='castbtn busy';
  btn.textContent='Waiting... ⚡ '+energy;
  spawnBubbles();

  const wait=950+Math.random()*1500;
  setTimeout(()=>{
    toast('🎣 Something nibbling...');
    document.getElementById('bobber').classList.add('nibble');
  },wait*.55);

  setTimeout(()=>{
    document.getElementById('bobber').classList.remove('nibble');
    busy=false;
    if(isTankFull()){
      btn.className='castbtn full';
      btn.textContent='Tank Full 🚫';
      syncHud();
      return;
    }
    const f=pickFish(getStats().quality);
    applyCatch(f,'manual');
    updateCastBtn();
  },wait);
}

function updateCastBtn(){
  const btn=document.getElementById('castbtn');
  if(!btn||busy) return;
  if(isTankFull()){
    btn.className='castbtn full';
    btn.textContent='Tank Full 🚫';
  } else {
    btn.className='castbtn';
    btn.textContent='Cast!  ⚡ '+energy;
  }
}

function idleTick(dt){
  if(isTankFull()) return; // hard stop
  const stats=getStats();
  idleCarry+=stats.fishPerSec*dt;
  const catches=Math.floor(idleCarry);
  if(catches<=0) return;
  idleCarry-=catches;
  let lastFish=null;
  for(let i=0;i<catches;i++){
    if(isTankFull()) break;
    const f=pickFish(stats.quality);
    const ok=applyCatch(f,'idle');
    if(ok) lastFish=f;
  }
  if(lastFish) toast('🌊 Idle: '+lastFish.n);
}

// ── SELL ──────────────────────────────────────────────────────────────────────
function sell(i){
  if(!slots[i]) return;
  const f=slots[i];
  gold+=f.v;
  slots[i]=null;
  toast('💰 Sold '+f.n+' for '+f.v+'🪙');
  refreshSlot(i);
  updateCastBtn();
  syncHud();
}

function sellAll(){
  let total=0,count=0;
  for(let i=0;i<tankCap();i++){
    if(slots[i]){total+=slots[i].v;count++;slots[i]=null;}
  }
  if(!count){toast('🧺 Tank already empty.');return;}
  gold+=total;
  buildTank();
  updateCastBtn();
  toast('🏪 Sold '+count+' fish for '+total+'🪙!');
  syncHud();
}

// ── FX ────────────────────────────────────────────────────────────────────────
function spawnPop(emoji){
  const g=document.getElementById('game');
  const d=document.createElement('div');
  d.className='fishpop';d.style.cssText='left:44%;top:52%;font-size:32px;';d.textContent=emoji;
  g.appendChild(d);setTimeout(()=>d.remove(),1400);
}
function flashScreen(){
  const g=document.getElementById('game');
  const d=document.createElement('div');d.className='catch-flash';
  g.appendChild(d);setTimeout(()=>d.remove(),450);
}
function spawnBubbles(){
  const g=document.getElementById('game');
  for(let i=0;i<6;i++){
    setTimeout(()=>{
      const b=document.createElement('div');b.className='bubble';
      const sz=4+Math.random()*9;
      b.style.cssText=`width:${sz}px;height:${sz}px;left:${30+Math.random()*40}%;bottom:${22+Math.random()*28}%;animation-duration:${1.4+Math.random()*.8}s`;
      g.appendChild(b);setTimeout(()=>b.remove(),2400);
    },i*180);

}
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const g=document.getElementById('game');
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  g.appendChild(t);setTimeout(()=>t.remove(),2300);

function makeStars(){

    s.style.cssText=`left:${Math.random()*100}%;top:${5+Math.random()*85}%;animation-delay:${Math.random()*2}s;width:${Math.random()<.2?4:2}px;height:${Math.random()<.2?4:2}px`;
    sky.appendChild(s);

}

// ── AREA / MISC ───────────────────────────────────────────────────────────────
function cycleArea(){
  let next=(areaIdx+1)%AREAS.length,start=next;
  while(!ownedAreas.has(next)){
    next=(next+1)%AREAS.length;
    if(next===start){toast('🗺️ Buy more areas first.');return;}
  }
  areaIdx=next;toast('🛶 Traveling to '+AREAS[areaIdx].name);syncHud();
}
function toggleNightBonus(){nightBonus=!nightBonus;toast(nightBonus?'🌙 Night bonus active!':'☀️ Night bonus off.');syncHud();}
function showStreak(){toast('📅 3-day streak! Keep it going.');}
function claimDaily(){
  if(!dailyReady){toast('🎁 Already claimed today!');return;}
  const r=120+level*10;gold+=r;gems+=1;dailyReady=false;
  toast('🎁 Daily: +'+r+'🪙 +1💎');syncHud();
}
function buyArea(idx){
  const a=AREAS[idx];if(!a||ownedAreas.has(idx)||gold<a.price)return;
  gold-=a.price;ownedAreas.add(idx);areaIdx=idx;
  toast('🗺️ Unlocked '+a.name+'!');syncHud();
}
function travelTo(idx){
  if(!ownedAreas.has(idx))return;
  areaIdx=idx;toast('🛶 Traveling to '+AREAS[idx].name);syncHud();
}
function buyEnergyRefill(){
  if(gold<80)return;
  gold-=80;energy=maxE;regenTimer=0;updateEnergyUI();toast('⚡ Energy refilled!');syncHud();
}
function buyGems(){
  if(gold<150)return;
  gold-=150;gems+=5;toast('💎 +5 gems!');syncHud();
}
function buyUpgrade(id){
  const u=UPGRADES.find(x=>x.id===id);
  const cost=upgradeCost(id);
  if(!u||upgrades[id]>=u.cap||gold<cost)return;
  gold-=cost;upgrades[id]++;
  // If tank upgrade, rebuild tank
  if(id==='tank') buildTank();
  toast('⚙️ '+u.label+' → Lv.'+upgrades[id]);
  syncHud();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function syncHud(){
  const stats=getStats();
  document.getElementById('gold-disp').textContent=formatNum(gold);
  document.getElementById('gem-disp').textContent=formatNum(gems);
  document.getElementById('level-line').textContent='🎣 Level '+level+' · '+AREAS[areaIdx].name;
  document.getElementById('aname').textContent=AREAS[areaIdx].name;
  document.getElementById('fps-readout').textContent=stats.fishPerSec.toFixed(2)+'/sec';
  document.getElementById('quality-line').textContent=qualLabel(stats.quality)+' '+Math.round(stats.quality);
  const upg=canUpgradeAny();
  document.getElementById('craft-badge').textContent=upg?'!':'';
  document.getElementById('upgrade-badge').textContent=upg?'!':'';
  updateTankHeader();
  updateCastBtn();
  if(document.getElementById('overlay').classList.contains('open')) rerenderActivePanel();
}

function renderMapPanel(){
  const items=AREAS.map((a,i)=>{
    const owned=ownedAreas.has(i),active=i===areaIdx,buyable=!owned&&gold>=a.price;
    return `<div class="loc-row"><div class="row-icon">🗺️</div><div class="row-main"><div class="row-title">${a.name}</div><div class="row-sub">${a.flavor}</div><div class="badge">+${a.qualBonus} quality · +${a.speedBonus.toFixed(2)} fps</div></div>${active?'<button disabled>Active</button>':owned?'<button onclick="travelTo('+i+')">Travel</button>':'<button onclick="buyArea('+i+')" '+(buyable?'':'disabled')+'>'+a.price+'🪙</button>'}</div>`;
  }).join('');
  setPanel('Map',items);
}
function renderBookPanel(){
  const rarities=['Common','Uncommon','Rare','Epic','Legendary'];
  const colors={Common:'#aaa',Uncommon:'#2ecc71',Rare:'#3498db',Epic:'#9b59b6',Legendary:'#f39c12'};
  let html='';
  for(const r of rarities){
    html+=`<div style="font-size:10px;font-weight:900;color:${colors[r]};padding:4px 0 2px;letter-spacing:1px">${r.toUpperCase()}</div>`;
    FISH.filter(f=>f.rarity===r).forEach(f=>{
      const seen=discovered.has(f.n);
      html+=`<div class="bestiary-row"><div class="row-icon">${seen?f.e:'❔'}</div><div class="row-main"><div class="row-title" style="color:${seen?colors[r]:'#555'}">${seen?f.n:'???'}</div><div class="row-sub">${seen?'Value: '+f.v+'🪙':'Catch to reveal'}</div></div></div>`;
    });
  }
  setPanel('Bestiary',html);
}
function renderCraftPanel(){
  const html=UPGRADES.map(u=>{
    const lv=upgrades[u.id],cost=upgradeCost(u.id),maxed=lv>=u.cap,pct=(lv/u.cap)*100;
    return `<div class="upgrade-row"><div class="row-icon">${u.icon}</div><div class="row-main"><div class="row-title">${u.label}</div><div class="row-sub">Lv.${lv} · ${u.desc}</div><div class="progress"><div style="width:${pct}%"></div></div></div><button onclick="buyUpgrade('${u.id}')" ${maxed||gold<cost?'disabled':''}>${maxed?'MAX':cost+'🪙'}</button></div>`;
  }).join('');
  setPanel('Craft',html);
}
function renderRankPanel(){
  const stats=getStats();
  const rating=Math.round(level*40+caughtToday*3+totalUpgradeLevels()*18+stats.quality*2+gold/10);
  setPanel('Rank',`
    <div class="card"><h4>Angler Rating</h4><p>You have <b>${rating}</b> points. ${discovered.size}/${FISH.length} species discovered.</p></div>
    <div class="stat-row"><div class="row-icon">🐟</div><div class="row-main"><div class="row-title">Caught Today</div><div class="row-sub">${caughtToday} fish</div></div></div>
    <div class="stat-row"><div class="row-icon">🧺</div><div class="row-main"><div class="row-title">Tank</div><div class="row-sub">${filledCount()}/${tankCap()} slots filled</div></div></div>
    <div class="stat-row"><div class="row-icon">🛠️</div><div class="row-main"><div class="row-title">Upgrades</div><div class="row-sub">${totalUpgradeLevels()} total levels</div></div></div>
  `);
}

// ── LOOP ──────────────────────────────────────────────────────────────────────
let lastFrame=performance.now();
function loop(now){
  const dt=Math.min((now-lastFrame)/1000,0.05);
  lastFrame=now;
  if(!busy) idleTick(dt);
  regenTick(dt);
  if(!busy&&Math.random()<.018) spawnBubbles();
  requestAnimationFrame(loop);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
makeStars();
buildTank();
updateEnergyUI();
syncHud();
setInterval(()=>{if(!dailyReady&&Math.random()<0.03){dailyReady=true;toast('🎁 Daily rewards ready!');syncHud();}},10000);
document.querySelectorAll('[data-panel]').forEach(el=>el.addEventListener('click',()=>openPanel(el.dataset.panel)));
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeOverlay();});
requestAnimationFrame(loop);
</script>
</body>
</html>
